name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same code, two sites:
      #   netsci2027/netsci2027.github.io → public site at "/" (landing only)
      #   netsci2027/dev                  → dev preview at "/dev" (full site + menu)
      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ github.repository == 'netsci2027/dev' && '/dev' || '/' }}
          PUBLIC_FULL_SITE: ${{ github.repository == 'netsci2027/dev' && '1' || '0' }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
