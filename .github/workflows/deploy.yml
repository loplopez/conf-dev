name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same code, two kinds of site:
      #   netsci2027/netsci2027.github.io -> public site at https://netsci2027.github.io/ (full site, live since 9 Oct 2026)
      #   any other repo (e.g. loplopez/conf-dev) -> dev preview at https://<owner>.github.io/<repo>/ (full site + menu)
      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ format('https://{0}.github.io', github.repository_owner) }}
          BASE_PATH: ${{ github.repository == 'netsci2027/netsci2027.github.io' && '/' || format('/{0}', github.event.repository.name) }}
          PUBLIC_FULL_SITE: '1'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
